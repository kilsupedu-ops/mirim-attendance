<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>아이콘 생성기</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; padding: 40px; background: #F0F4F8; }
    p { margin: 12px 0; font-size: 1rem; color: #333; }
    button { padding: 12px 24px; background: #1565C0; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-family: inherit; }
    button:hover { background: #0D47A1; }
  </style>
</head>
<body>
  <h2>PWA 아이콘 생성</h2>
  <p>버튼을 클릭하면 <code>icon-192.png</code>와 <code>icon-512.png</code>가 다운로드됩니다.</p>
  <p>다운로드된 파일을 <code>icons/</code> 폴더에 넣어주세요.</p>
  <button onclick="generateIcons()">아이콘 다운로드</button>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    function drawIcon(canvas, size) {
      canvas.width = size;
      canvas.height = size;
      var ctx = canvas.getContext('2d');

      // Rounded rectangle background
      var r = size * 0.15;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = '#1565C0';
      ctx.fill();

      // Document shape
      var mx = size * 0.18;
      var my = size * 0.10;
      var mw = size * 0.64;
      var mh = size * 0.80;
      var fold = size * 0.18;

      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx + mw - fold, my);
      ctx.lineTo(mx + mw, my + fold);
      ctx.lineTo(mx + mw, my + mh);
      ctx.lineTo(mx, my + mh);
      ctx.closePath();
      ctx.fillStyle = 'white';
      ctx.fill();

      // Fold triangle
      ctx.beginPath();
      ctx.moveTo(mx + mw - fold, my);
      ctx.lineTo(mx + mw - fold, my + fold);
      ctx.lineTo(mx + mw, my + fold);
      ctx.closePath();
      ctx.fillStyle = '#BBDEFB';
      ctx.fill();

      // Lines
      var lx = mx + size * 0.10;
      var lw = mw - size * 0.20;
      var lineH = size * 0.035;
      var lineR = lineH / 2;
      [0.42, 0.52, 0.62].forEach(function(y, i) {
        var w = i === 2 ? lw * 0.6 : lw;
        ctx.beginPath();
        ctx.roundRect(lx, size * y, w, lineH, lineR);
        ctx.fillStyle = 'rgba(21,101,192,0.35)';
        ctx.fill();
      });

      // Checkmark
      ctx.strokeStyle = '#1565C0';
      ctx.lineWidth = size * 0.04;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(mx + size*0.10, my + mh * 0.72);
      ctx.lineTo(mx + size*0.22, my + mh * 0.84);
      ctx.lineTo(mx + size*0.44, my + mh * 0.62);
      ctx.stroke();
    }

    function generateIcons() {
      var canvas = document.getElementById('canvas');
      [192, 512].forEach(function(size) {
        drawIcon(canvas, size);
        var link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = 'icon-' + size + '.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
      alert('다운로드가 시작되었습니다.\n두 파일을 icons/ 폴더에 넣어주세요.');
    }
  </script>
</body>
</html>
